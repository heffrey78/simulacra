# A theme pack. The engine knows nothing about setting; everything genre-shaped
# lives in files like this one. Swap with `SIMULACRA_THEME=<name>`.
#
# Two kinds of content here:
#   * prompt fragments  -- injected into director/narrator/judge calls
#   * name pools        -- used by procedural generation with zero LLM cost,
#                          and as few-shot anchors so the model stays in voice
#
# Keep fragments SHORT. Every word here is prompt tokens on every call, and
# prompt eval is not free on CPU.

name = "Simulacra"
tagline = "A dungeon that is a copy of somewhere that no longer exists."

[voice]
# The narrator's standing instruction. Two sentences maximum -- a 1.7b model
# follows a tight brief far better than a long one.
system = """You narrate a dungeon that is an imperfect copy of a place long gone. \
Write in second person, present tense. Be concrete and sensory; never explain the \
metaphor. Two sentences, maximum forty words."""

# Words to lean on and words to ban. The ban list is doing real work: small
# models reach for the same half-dozen adjectives constantly.
motifs = ["repetition", "wear", "copies", "seams", "residue", "half-remembered", "wrongness"]
banned = ["ancient", "eerie", "mysterious", "eldritch", "you feel a sense of", "little did you know"]

[director]
# Tier-3 call, once per floor. Asked for a concept, not a layout.
system = """You design one floor of a dungeon that imperfectly copies a vanished place. \
Give it a specific identity, not a generic one. Be terse."""

# When a floor's name is refused -- repeated in this world, or a stock phrase
# like "Echoes of the Forgotten" -- it takes this instead. {nth} is First,
# Second...; {n} is the depth.
floor_name = "The {nth} Impression"

# What the model is told each structural room *is*, in this theme's words (M12).
# Without these the engine's neutral descriptions are used; either way the
# model never sees "shrine" or "vault", which it reads as altars and keys.
[roles]
entrance = "where the copy begins"
corridor = "a stretch the copy repeats"
chamber  = "a workroom where copies were made"
vault    = "where the best impression is kept"
lair     = "where something has settled into the copy"
shrine   = "the part the copy got most nearly right"
descent  = "the way down to the next impression"

[judge]
# Tier-1 call. Rules on improvised actions.
system = """You are a strict, fair referee. Decide if the action is physically \
plausible given the room. Prefer allowing clever actions. Be terse."""

# -- name pools ------------------------------------------------------------
# Procedural generation draws from these. Structure (RoomKind) is code's job;
# these decide what the structure is CALLED.

[rooms]
entrance = ["the Threshold", "the Reproduced Gate", "First Landing"]
corridor = ["a seam", "a repeated hall", "a corridor that recurs", "the narrowing"]
chamber  = ["a copied chamber", "the workroom", "a room of drafts", "the annex"]
vault    = ["the Reliquary", "the Master Copy", "the Sealed Print"]
lair     = ["the Nest", "the Spoiled Room", "where it settled"]
shrine   = ["the Original", "the Reference Room", "the Unworn Place"]
descent  = ["the stair down", "a shaft of repeated steps", "the next impression"]

[monsters]
# name, hp, attack, defense -- code balances, theme names.
weak   = [["a smudged figure", 6, 2, 10], ["a partial", 5, 2, 9], ["an offcut", 7, 1, 10]]
normal = [["a duplicate", 12, 3, 12], ["the worn attendant", 14, 3, 11]]
strong = [["a compound thing", 22, 5, 14], ["the Overprint", 26, 6, 13]]

# What a room of each kind plausibly holds, beyond whatever the director wrote
# into its concept. Looking at one of these may find something; looking at a
# noun the room's own prose already used always does.
[fixtures]
entrance = ["the threshold", "the doorway", "scuff marks", "a boot scraper"]
corridor = ["the seam", "the wall", "a join", "worn flagstones"]
chamber  = ["a workbench", "drafts", "offcuts", "a rack of formes"]
vault    = ["shelves", "a strongbox", "ledgers", "wax seals"]
lair     = ["a nest", "bones", "spoil", "scratch marks"]
shrine   = ["an altar", "offerings", "a basin", "carvings"]
descent  = ["the stair", "the rail", "a landing", "handprints"]

[items]
weapon  = [["a stuttering blade", 4], ["a copyist's knife", 3]]
healing = [["a jar of clean water", 6], ["an unspoiled ration", 4]]
key     = [["a key with no teeth"], ["a seal, half-pressed"]]

# What a thing leaves when it is finished (M14). Optional per tier and per
# category -- anything not listed drops from [items]. Code decides how often.
[drops]
weak.healing  = [["a fold of paper with clean water in it", 3]]
strong.weapon = [["the Overprint's edge", 5], ["a compound blade", 5]]

[npcs]
# NPCs persist across runs and accumulate memory. `anchor` is the graph node id.
#
# `depth` is the floor they live on. `canon` is authored backstory -- stable
# facts the NPC can state about itself, never generated and never rewritten.
# Keep each one to a single short sentence: they are prompt tokens on every
# conversation, and they are also the only thing derived canon is grown from.
[[npcs.roster]]
anchor = "npc:archivist"
name = "the Archivist"
role = "keeps count of everyone who has gone down"
voice = "Terse and clerical, like reading from a ledger. Refers to delvers by number, never by name."
depth = 1
# Said verbatim, with no model call, when there is nothing to say or it has
# already been said. Code owns *that* they refuse; this owns how it sounds.
refusal = "Not in the ledger."
repeat = "It is already entered."
canon = [
  "Has kept the ledger since before the current numbering began.",
  "Will not go below the third floor, and will not say why.",
]

[[npcs.roster]]
anchor = "npc:corrector"
name = "the Corrector"
role = "mends the places where the copy has worn through"
voice = "Patient and apologetic. Corrects itself mid-sentence, and never quite finishes a thought."
depth = 3
refusal = "I have not got to that one. Not yet."
repeat = "I did say. I did already say that."
canon = [
  "Has been repairing the same corridor for longer than it can account for.",
  "Believes the original is still down there somewhere, unworn.",
  "Does not trust the Archivist's count.",
]
