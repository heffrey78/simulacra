[project]
name = "simulacra"
version = "0.0.1"
description = "An endless text dungeon, generated and narrated by a local Ollama model."
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "sqlite-vec>=0.1.9",
    "numpy>=2.1",
    "rich>=13.9",
]

[project.optional-dependencies]
# Optional on purpose: the founding brief's first line was "must use minimal
# resources", and the headless/offline path must not grow a UI framework it
# never imports. For installs: `pip install simulacra[tui]`.
tui = ["textual>=8.2"]

[dependency-groups]
# A checkout's environment. A group rather than an extra because `uv run` syncs
# to the dependencies plus the default groups: as extras, every plain
# `uv run simulacra` uninstalled pytest and Textual (M11.1).
dev = ["pytest>=8.3", "pytest-cov>=6.0", "textual>=8.2"]

[project.scripts]
simulacra = "simulacra.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simulacra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Anything touching a live model is opt-in: `pytest -m llm`
markers = ["llm: requires a running Ollama daemon"]
addopts = "-m 'not llm'"
